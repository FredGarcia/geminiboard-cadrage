# Gemini CLI réel, lancé comme le board, sous Linux et sous Windows natif (D13), sans compte :
# une clé d'API invalide suffit à vérifier le lancement (code 144, ou 400 sous Windows), la mesure de la
# mémoire et le masquage du spike ; le spike S5 vérifie l'activation par extension de projet (catalogue).
# Chaque lundi, la dernière version de Gemini CLI est éprouvée (une version sort chaque semaine).
# Chaque étape passe par tools/ci-run.mjs, qui publie la fin de la sortie en annotation si elle échoue.
name: gemini-cli

on:
  push:
    paths:
      - packages/server/src/run-gemini.mjs
      - spike/**
      - tools/ci-run.mjs
      - tools/ci-spike-check.mjs
      - .github/workflows/gemini-cli.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: Gemini CLI réel, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node tools/ci-run.mjs "npm ci" npm ci
      - run: node tools/ci-run.mjs "Installation de Gemini CLI" npm install -g @google/gemini-cli@latest
      - name: Spike S4, clé d'API invalide
        env:
          GEMINI_API_KEY: cle-invalide-pour-la-ci
        run: node tools/ci-run.mjs "Spike S4" node spike/capture.mjs --only S4 --timeout 120 --out ci-spike
      - run: node tools/ci-run.mjs "Contrôle du spike" node tools/ci-spike-check.mjs ci-spike
      - run: node tools/ci-run.mjs "Spike S5 (catalogue)" node spike/catalogue.mjs

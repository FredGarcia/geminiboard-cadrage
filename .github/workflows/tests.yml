# Tests du board sous Linux (proche de WSL2) et sous Windows natif (D13),
# avec Node.js 20 (D10) et 22 (Q12). Le faux Gemini CLI remplace le vrai : ni réseau, ni compte, ni secret.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: better-sqlite3 installé sans compilation
        shell: bash
        run: test ! -e node_modules/better-sqlite3/build/config.gypi || { echo "::error::better-sqlite3 a été compilé à l'installation (pas de binaire précompilé)"; exit 1; }
      - run: npm run test:ci
